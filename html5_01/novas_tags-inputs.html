<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tags Inputs HTML5</title>

	<!--Estilo CSS -->
	<link rel="stylesheet" type="text/css" href="css/estilo.css">
	

</head>
<body>

	<form>

		<!--Novos inputs HTML5-->

		<!--Nome-- required-->
		<label for="nome">Nome: </label>
		<input type="text" name="nome" id="nome"  autofocus><br><br>

		<!--Email  required-->
		<label for="email">Email: </label>
		<input type="email" id="email" ><br><br>

		<!--Número   required-->
		<label for="numero">Número: </label>
		<input type="number" id="numero" min="1" max="20" step="5"><br><br>

		<!--URL-->
		<label for="url">Url: </label>
		<input type="url" id="url" placeholder="Ex: https://www."><br><br>

		<!--Pesquisa-->
		<label for="pesquisa">Pesquisar: </label>
		<input type="search" id="pesquisa" placeholder="Encontre aqui"><br><br>

		<!--Range-->
		<label for="range">Range: </label>
		<input type="range" id="range" min="1" max="20" value="2"><br><br>

		<!--Data-->
		<label for="data">Data: </label>
		<input type="date" id="data"><br><br>

		<!--Cor-->
		<label for="cor">Cor: </label>
		<input type="color" id="cor"><br><br>
		
		<input type="submit" name="" value="Enviar">

	</form>
	
</body>
</html
